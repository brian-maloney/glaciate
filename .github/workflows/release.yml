name: Release

# Builds the release ZIP once from a version tag, checks it, and publishes it as a GitHub Release (DECISIONS.md D40)
# and, after approval, to the WordPress.org plugin directory (D50).
# A pushed x.y.z tag starts it; "Run workflow" releases an existing tag, using the tools from this commit.

on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (x.y.z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Same version as DECISIONS.md D27 records; bump both together.
  PLUGIN_CHECK_VERSION: 2.1.0

jobs:
  ci:
    name: CI on the tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build:
    name: Build and check the ZIP
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Check out the release tools from this workflow's commit
        uses: actions/checkout@v7
        with:
          path: .release-tools
          sparse-checkout: bin
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Tag, plugin header, GLACIATE_VERSION and Stable tag agree
        run: node .release-tools/bin/release.mjs check-version "$TAG"
      - run: npm ci
      - run: npm run env:start
      - name: Build the ZIP from the tag
        run: npm run build:zip -- HEAD
      - name: Plugin Check on the ZIP's contents
        run: |
          rm -rf build/pcheck && mkdir -p build/pcheck
          unzip -q "build/glaciate-$TAG.zip" -d build/pcheck
          npx wp-env run cli wp plugin install plugin-check --version="$PLUGIN_CHECK_VERSION" --activate --force
          npx wp-env run cli wp plugin check /var/www/html/wp-content/plugins/glaciate/build/pcheck/glaciate --format=json > build/plugin-check.txt 2>&1
          node .release-tools/bin/release.mjs gate build/plugin-check.txt
      - name: Checksum and release notes
        run: |
          cd build
          sha256sum "glaciate-$TAG.zip" > "glaciate-$TAG.zip.sha256"
          cd ..
          node .release-tools/bin/release.mjs notes "$TAG" > build/notes.md
          printf '\n\nInstall: download `glaciate-%s.zip` and upload it under Plugins → Add New → Upload Plugin. Check it with `sha256sum -c glaciate-%s.zip.sha256`.\n' "$TAG" "$TAG" >> build/notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            build/glaciate-${{ env.TAG }}.zip
            build/glaciate-${{ env.TAG }}.zip.sha256
            build/notes.md
            build/plugin-check.txt
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    # The only job that can write, and it runs no project code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists; delete it first to publish again." >&2
            exit 1
          fi
          gh release create "$TAG" "glaciate-$TAG.zip" "glaciate-$TAG.zip.sha256" \
            --verify-tag --title "Glaciate $TAG" --notes-file notes.md

  wordpress-org:
    name: Publish to WordPress.org
    needs: publish
    # Opt-in until the repository has the wordpress-org environment and its SVN secrets (D50).
    if: ${{ vars.WORDPRESS_ORG_PUBLISH == 'true' }}
    # One Subversion commit at a time, from either workflow.
    concurrency:
      group: wordpress-org-svn
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Required reviewers on this environment make every directory release wait for a person: a commit here reaches
    # every site's updates. Its secrets exist only for this job.
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/glaciate/
    steps:
      - name: Check out the publishing script from this workflow's commit
        uses: actions/checkout@v7
        with:
          path: .release-tools
          sparse-checkout: bin
      - name: Check out the directory assets from the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          path: .tag
          sparse-checkout: .wordpress-org
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Subversion
        run: command -v svn > /dev/null || { sudo apt-get update -q && sudo apt-get install -yq subversion; }
      - name: Commit trunk, tags/${{ env.TAG }} and assets
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          sha256sum -c "glaciate-$TAG.zip.sha256"
          unzip -q "glaciate-$TAG.zip" -d plugin
          .release-tools/bin/svn-publish.sh release https://plugins.svn.wordpress.org/glaciate "$TAG" \
            plugin/glaciate .tag/.wordpress-org
